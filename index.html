<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <title>Altics Biometric Kiosk</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #020617; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    #qr-reader { width: 100%; border-radius: 16px; overflow: hidden; border: none !important; }
    #qr-reader video { border-radius: 16px; object-fit: cover; transform: scaleX(-1); }
    @media print {
      body * { visibility: hidden; }
      #printable-badge, #printable-badge * { visibility: visible; }
      #printable-badge {
        position: fixed;
        left: 50%;
        top: 40px;
        transform: translateX(-50%);
        border: 2px solid #0f172a;
        box-shadow: none !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwi6Tog6w0YR0lkeFk1GIITrsVFsItVz8t-Spr6vSyG0nMVzznx6UqAEs_pX7KxFoYk/exec";
    const ADMIN_PIN = "1234"; // Change this to your private Admin PIN

    const FACE_MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model";
    const FACE_MATCH_THRESHOLD = 0.42;
    const FACE_MARGIN_MIN = 0.07;
    const DEBOUNCE_MS = 5000;

    // Smart Auto Mode Thresholds
    const AUTO_LUNCH_HOUR = 13;          // 13:00 (1:00 PM) irrespective of shift
    const AUTO_CHECKOUT_HOURS = 7;       // Auto Check-Out after 7 hours of shift
    const MIN_MINS_BEFORE_LUNCH = 30;    // Prevents accidental Lunch Out right after Check-In
    const MIN_MINS_BEFORE_LUNCH_IN = 2;  // Prevents accidental Post Lunch In while walking away

    function getTodayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function timeToMinutes(hhmm) {
      const [h, m] = (hhmm || '10:00').split(':').map(Number);
      return (h * 60) + (m || 0);
    }

    function averageDescriptors(descriptors) {
      const len = descriptors[0].length;
      const avg = new Array(len).fill(0);
      for (const desc of descriptors) {
        for (let i = 0; i < len; i++) {
          avg[i] += desc[i];
        }
      }
      for (let i = 0; i < len; i++) {
        avg[i] /= descriptors.length;
      }
      return avg;
    }

    function EmployeeQRCode({ value, size = 140 }) {
      const svgMarkup = useMemo(() => {
        if (typeof window === 'undefined' || !window.qrcode) return '';
        const qr = window.qrcode(0, 'M');
        qr.addData(value);
        qr.make();
        return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      }, [value]);

      return (
        <div
          style={{ width: size, height: size, display: 'inline-block', lineHeight: 0 }}
          dangerouslySetInnerHTML={{ __html: svgMarkup }}
        />
      );
    }

    function AlticsKiosk() {
      const [activeTab, setActiveTab] = useState('kiosk');
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [pendingAdminTab, setPendingAdminTab] = useState(null);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      const [scanMode, setScanMode] = useState('AUTO');
      const [authPolicy, setAuthPolicy] = useState('FACE_ONLY');
      const [voiceEnabled, setVoiceEnabled] = useState(true);
      const [scanStatus, setScanStatus] = useState(null);
      const [liveAiHint, setLiveAiHint] = useState('');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [cameraActive, setCameraActive] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [modelsLoaded, setModelsLoaded] = useState(false);

      // v4 key ensures fresh 10:00 AM (+10m grace) and 30m Lunch (+5m grace) defaults load cleanly
      const [shiftRules, setShiftRules] = useState(() => {
        const saved = localStorage.getItem('altics_shift_rules_v4');
        if (saved) { try { return JSON.parse(saved); } catch (e) {} }
        return {
          checkInTime: '10:00',
          graceMinutes: 10,
          checkOutTime: '18:15',
          lunchStart: '13:00',
          lunchEnd: '14:30',
          maxLunchMinutes: 30,
          lunchGraceMinutes: 5
        };
      });

      const shiftRulesRef = useRef(shiftRules);
      shiftRulesRef.current = shiftRules;

      useEffect(() => {
        localStorage.setItem('altics_shift_rules_v4', JSON.stringify(shiftRules));
      }, [shiftRules]);

      const [enrollingEmp, setEnrollingEmp] = useState(null);
      const [enrollMsg, setEnrollMsg] = useState('');
      const [capturingFace, setCapturingFace] = useState(false);
      const enrollVideoRef = useRef(null);
      const enrollStreamRef = useRef(null);

      const [editingShiftEmp, setEditingShiftEmp] = useState(null);
      const [empShiftForm, setEmpShiftForm] = useState({ useCustom: false, checkInTime: '10:00', checkOutTime: '18:15', maxLunchMinutes: 30 });

      const [editingEmp, setEditingEmp] = useState(null);
      const [editEmpForm, setEditEmpForm] = useState({ id: '', name: '', department: 'Development', role: '' });

      const scannerRef = useRef(null);
      const faceLoopRef = useRef(null);
      const isProcessingFaceRef = useRef(false);
      const actionLockMapRef = useRef({});
      const consecutiveMatchRef = useRef({ empId: null, count: 0 });
      const scanModeRef = useRef(scanMode);
      scanModeRef.current = scanMode;
      const authPolicyRef = useRef(authPolicy);
      authPolicyRef.current = authPolicy;
      const voiceEnabledRef = useRef(voiceEnabled);
      voiceEnabledRef.current = voiceEnabled;

      const [employees, setEmployees] = useState(() => {
        const saved = localStorage.getItem('altics_employees');
        if (saved) { try { return JSON.parse(saved); } catch (e) {} }
        return [
          { id: 'EMP-101', name: 'Aarav Sharma', department: 'Development', role: 'Software Engineer', faceDescriptor: null, customShift: null },
          { id: 'EMP-102', name: 'Priya Deshmukh', department: 'Design', role: 'UI/UX Lead', faceDescriptor: null, customShift: null },
          { id: 'EMP-103', name: 'Rohan Kulkarni', department: 'Marketing', role: 'Growth Specialist', faceDescriptor: null, customShift: null },
          { id: 'EMP-104', name: 'Ananya Patil', department: 'Operations', role: 'Project Manager', faceDescriptor: null, customShift: null },
          { id: 'EMP-105', name: 'Vikram Joshi', department: 'Development', role: 'Backend Engineer', faceDescriptor: null, customShift: null }
        ];
      });

      const employeesRef = useRef(employees);
      employeesRef.current = employees;

      const [attendanceLogs, setAttendanceLogs] = useState(() => {
        const saved = localStorage.getItem('altics_attendance_logs');
        if (saved) { try { return JSON.parse(saved); } catch (e) {} }
        return [];
      });

      const attendanceLogsRef = useRef(attendanceLogs);
      attendanceLogsRef.current = attendanceLogs;

      const [showAddModal, setShowAddModal] = useState(false);
      const [newEmpId, setNewEmpId] = useState('');
      const [newEmpName, setNewEmpName] = useState('');
      const [newEmpDept, setNewEmpDept] = useState('Development');
      const [newEmpRole, setNewEmpRole] = useState('');
      const [newEmpCustomShift, setNewEmpCustomShift] = useState(false);
      const [newEmpIn, setNewEmpIn] = useState('10:00');
      const [newEmpOut, setNewEmpOut] = useState('18:15');
      const [newEmpLunch, setNewEmpLunch] = useState(30);
      const [selectedBadge, setSelectedBadge] = useState(null);

      const isSheetConfigured = GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.startsWith('https://script.google.com/');

      const handleTabSwitch = (targetTab) => {
        if (targetTab === 'kiosk') {
          setIsAdminUnlocked(false);
          setActiveTab('kiosk');
          return;
        }
        if (isAdminUnlocked) {
          setActiveTab(targetTab);
        } else {
          setPendingAdminTab(targetTab);
          setPinInput('');
          setPinError('');
        }
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput.trim() === String(ADMIN_PIN)) {
          setIsAdminUnlocked(true);
          if (pendingAdminTab) {
            setActiveTab(pendingAdminTab);
          }
          setPendingAdminTab(null);
          setPinInput('');
          setPinError('');
        } else {
          setPinError('Incorrect PIN. Access denied.');
          setPinInput('');
        }
      };

      const lockAdminNow = () => {
        setIsAdminUnlocked(false);
        setActiveTab('kiosk');
      };

      const getNextAutoEmpId = () => {
        const maxNum = employees.reduce((max, emp) => {
          const num = parseInt(String(emp.id).replace(/\D/g, ''), 10);
          return !isNaN(num) && num > max ? num : max;
        }, 100);
        return 'EMP-' + (maxNum + 1);
      };

      const getEffectiveRulesForEmployee = (employee) => {
        const globalRules = shiftRulesRef.current;
        if (employee && employee.customShift) {
          return {
            ...globalRules,
            checkInTime: employee.customShift.checkInTime || globalRules.checkInTime,
            checkOutTime: employee.customShift.checkOutTime || globalRules.checkOutTime,
            maxLunchMinutes: employee.customShift.maxLunchMinutes || globalRules.maxLunchMinutes
          };
        }
        return globalRules;
      };

      useEffect(() => {
        const loadFaceModels = async () => {
          try {
            if (!window.faceapi) return;
            await Promise.all([
              window.faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
              window.faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
              window.faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)
            ]);
            setModelsLoaded(true);
          } catch (err) {
            console.error('Face model load error:', err);
          }
        };
        loadFaceModels();
      }, []);

      const sendLogToGoogleSheet = async (logEntry) => {
        if (!isSheetConfigured || !navigator.onLine) return false;
        try {
          await fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(logEntry)
          });
          return true;
        } catch (err) {
          return false;
        }
      };

      const syncPendingLogs = async (currentLogs) => {
        if (!isSheetConfigured || !navigator.onLine) return;
        const unsynced = currentLogs.filter(l => !l.synced);
        if (unsynced.length === 0) return;

        setIsSyncing(true);
        for (const item of unsynced) {
          const ok = await sendLogToGoogleSheet(item);
          if (ok) {
            setAttendanceLogs(prev =>
              prev.map(log => (log.id === item.id ? { ...log, synced: true } : log))
            );
          }
        }
        setIsSyncing(false);
      };

      useEffect(() => {
        const handleOnline = () => {
          setIsOnline(true);
          setScanStatus({ type: 'info', message: 'Internet restored! Syncing queued logs to Google Sheets...' });
          const saved = JSON.parse(localStorage.getItem('altics_attendance_logs') || '[]');
          syncPendingLogs(saved);
        };
        const handleOffline = () => setIsOnline(false);

        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => {
        localStorage.setItem('altics_employees', JSON.stringify(employees));
      }, [employees]);

      useEffect(() => {
        localStorage.setItem('altics_attendance_logs', JSON.stringify(attendanceLogs));
      }, [attendanceLogs]);

      const euclideanDistance = (arr1, arr2) => {
        let sum = 0;
        for (let i = 0; i < arr1.length; i++) {
          const diff = arr1[i] - arr2[i];
          sum += diff * diff;
        }
        return Math.sqrt(sum);
      };

      const unlockSpeechEngine = () => {
        try {
          if ('speechSynthesis' in window) {
            const silent = new SpeechSynthesisUtterance('');
            silent.volume = 0;
            window.speechSynthesis.speak(silent);
          }
        } catch (e) {}
      };

      const playBeepAndSpeak = (success = true, spokenPhrase = '') => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioCtx();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = success ? 'sine' : 'sawtooth';
          osc.frequency.setValueAtTime(success ? 880 : 220, audioCtx.currentTime);
          if (success) {
            osc.frequency.setValueAtTime(1174.66, audioCtx.currentTime + 0.08);
          }
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + (success ? 0.22 : 0.45));
        } catch (e) {}

        if (spokenPhrase && voiceEnabledRef.current && 'speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            setTimeout(() => {
              const utterance = new SpeechSynthesisUtterance(spokenPhrase);
              utterance.rate = 1.02;
              utterance.pitch = 1.0;
              utterance.volume = 1.0;
              window.speechSynthesis.speak(utterance);
            }, 180);
          } catch (e) {}
        }
      };

      const evaluateScheduleStatus = (employee, activeMode, nowDate) => {
        const rules = getEffectiveRulesForEmployee(employee);
        const nowMins = nowDate.getHours() * 60 + nowDate.getMinutes();

        if (activeMode === 'CHECK_IN') {
          const grace = Number(rules.graceMinutes ?? 10);
          const targetIn = timeToMinutes(rules.checkInTime) + grace;
          if (nowMins > targetIn) {
            const lateBy = nowMins - timeToMinutes(rules.checkInTime);
            return { tag: `Late +${lateBy}m`, spokenExtra: ', Late arrival noted' };
          }
          return { tag: 'On Time', spokenExtra: '' };
        }

        if (activeMode === 'CHECK_OUT') {
          const targetOut = timeToMinutes(rules.checkOutTime);
          if (nowMins < targetOut) {
            const earlyBy = targetOut - nowMins;
            return { tag: `Early -${earlyBy}m`, spokenExtra: ', Early checkout noted' };
          }
          return { tag: 'Full Shift', spokenExtra: '' };
        }

        if (activeMode === 'LUNCH_OUT') {
          if (!employee.customShift) {
            const lStart = timeToMinutes(rules.lunchStart);
            const lEnd = timeToMinutes(rules.lunchEnd);
            if (nowMins < lStart || nowMins > lEnd) {
              return { tag: 'Outside Lunch Window', spokenExtra: '' };
            }
          }
          return { tag: 'Lunch Break', spokenExtra: '' };
        }

        if (activeMode === 'LUNCH_IN') {
          const todayKey = getTodayKey();
          const lastLunchOut = attendanceLogsRef.current.find(
            l => l.empId === employee.id && l.date === todayKey && l.type === 'LUNCH_OUT' && l.rawTs
          );
          if (lastLunchOut) {
            const breakMins = Math.round((nowDate.getTime() - lastLunchOut.rawTs) / 60000);
            const maxAllowedLunch = Number(rules.maxLunchMinutes ?? 30) + Number(rules.lunchGraceMinutes ?? 5);
            if (breakMins > maxAllowedLunch) {
              return { tag: `Lunch ${breakMins}m (Over)`, spokenExtra: ', Extended lunch noted' };
            }
            return { tag: `Lunch ${breakMins}m`, spokenExtra: '' };
          }
          return { tag: 'Returned', spokenExtra: '' };
        }

        return { tag: '', spokenExtra: '' };
      };

      const resolveSmartAutoAction = (employee, nowDate) => {
        const todayKey = getTodayKey();
        const todayEmpLogs = attendanceLogsRef.current.filter(l => {
          const logDate = l.date || todayKey;
          return l.empId === employee.id && logDate === todayKey && l.type !== 'FIELD_DUTY';
        });

        const latest = todayEmpLogs[0];
        const nowMs = nowDate.getTime();
        const nowHours = nowDate.getHours();
        const nowMins = nowHours * 60 + nowDate.getMinutes();
        const rules = getEffectiveRulesForEmployee(employee);

        if (!latest) {
          return { allowed: true, resolvedMode: 'CHECK_IN' };
        }

        if (latest.type === 'CHECK_OUT') {
          return {
            allowed: false,
            message: `${employee.name}, you have already checked out today (at ${latest.time}). Use manual Check-In for a second shift.`,
            spoken: `You have already checked out today, ${employee.name}`
          };
        }

        if (latest.type === 'LUNCH_OUT') {
          const minsSinceLunchOut = latest.rawTs ? (nowMs - latest.rawTs) / 60000 : MIN_MINS_BEFORE_LUNCH_IN;
          if (minsSinceLunchOut < MIN_MINS_BEFORE_LUNCH_IN) {
            return {
              allowed: false,
              message: `${employee.name}, Lunch Out was just logged at ${latest.time}. Scan again when returning.`,
              spoken: `Lunch out already logged, ${employee.name}`
            };
          }
          return { allowed: true, resolvedMode: 'LUNCH_IN' };
        }

        const firstCheckIn = [...todayEmpLogs].reverse().find(l => l.type === 'CHECK_IN');
        const checkInTs = firstCheckIn && firstCheckIn.rawTs ? firstCheckIn.rawTs : (latest.rawTs || nowMs);
        const hoursSinceCheckIn = (nowMs - checkInTs) / 3600000;
        const minsSinceCheckIn = (nowMs - checkInTs) / 60000;
        const shiftEndMins = timeToMinutes(rules.checkOutTime);

        if (hoursSinceCheckIn >= AUTO_CHECKOUT_HOURS || (nowMins >= shiftEndMins && hoursSinceCheckIn >= 1)) {
          return { allowed: true, resolvedMode: 'CHECK_OUT' };
        }

        const hasTakenLunch = todayEmpLogs.some(l => l.type === 'LUNCH_OUT');
        if (!hasTakenLunch && nowHours >= AUTO_LUNCH_HOUR && minsSinceCheckIn >= MIN_MINS_BEFORE_LUNCH) {
          return { allowed: true, resolvedMode: 'LUNCH_OUT' };
        }

        if (!hasTakenLunch && nowHours < AUTO_LUNCH_HOUR) {
          return {
            allowed: false,
            message: `You are already checked in, ${employee.name} (since ${firstCheckIn ? firstCheckIn.time : latest.time}). Auto Lunch Out starts at 1:00 PM.`,
            spoken: `You are already checked in, ${employee.name}`
          };
        }

        if (!hasTakenLunch && minsSinceCheckIn < MIN_MINS_BEFORE_LUNCH) {
          return {
            allowed: false,
            message: `You just checked in, ${employee.name} (at ${firstCheckIn ? firstCheckIn.time : latest.time}).`,
            spoken: `You are already checked in, ${employee.name}`
          };
        }

        return {
          allowed: false,
          message: `You are already checked in, ${employee.name}. Auto Check-Out unlocks after ${AUTO_CHECKOUT_HOURS}h or at ${rules.checkOutTime} (tap Check-Out manually for half-day).`,
          spoken: `You are already checked in, ${employee.name}`
        };
      };

      const validateDuplicateAction = (employee, activeMode) => {
        if (activeMode === 'FIELD_DUTY') return { allowed: true, resolvedMode: 'FIELD_DUTY' };
        if (activeMode === 'AUTO') return resolveSmartAutoAction(employee, new Date());

        const todayKey = getTodayKey();
        const todayEmpLogs = attendanceLogsRef.current.filter(l => {
          const logDate = l.date || todayKey;
          return l.empId === employee.id && logDate === todayKey && l.type !== 'FIELD_DUTY';
        });

        const latest = todayEmpLogs[0];

        if (activeMode === 'CHECK_IN') {
          if (latest && (latest.type === 'CHECK_IN' || latest.type === 'LUNCH_IN' || latest.type === 'LUNCH_OUT')) {
            return {
              allowed: false,
              message: `You are already checked in, ${employee.name} (since ${latest.time}).`,
              spoken: `You are already checked in, ${employee.name}`
            };
          }
        }

        if (activeMode === 'CHECK_OUT') {
          if (!latest || latest.type === 'CHECK_OUT') {
            return {
              allowed: false,
              message: `You are already checked out, ${employee.name}. Please Check-In first.`,
              spoken: `You are already checked out, ${employee.name}`
            };
          }
        }

        if (activeMode === 'LUNCH_OUT') {
          if (!latest || latest.type === 'CHECK_OUT') {
            return {
              allowed: false,
              message: `${employee.name}, please Check-In before marking Lunch Out.`,
              spoken: `Please check in first, ${employee.name}`
            };
          }
          if (latest.type === 'LUNCH_OUT') {
            return {
              allowed: false,
              message: `${employee.name}, you are already marked on Lunch Out (since ${latest.time}).`,
              spoken: `You are already on lunch out, ${employee.name}`
            };
          }
        }

        if (activeMode === 'LUNCH_IN') {
          if (!latest || latest.type !== 'LUNCH_OUT') {
            return {
              allowed: false,
              message: `${employee.name}, you are already checked in (no active Lunch Out found).`,
              spoken: `You are already checked in, ${employee.name}`
            };
          }
        }

        return { allowed: true, resolvedMode: activeMode };
      };

      const findStrictFaceMatch = (liveDesc, enrolledList) => {
        const ranked = enrolledList
          .map(emp => ({ emp, dist: euclideanDistance(liveDesc, emp.faceDescriptor) }))
          .sort((a, b) => a.dist - b.dist);

        const best = ranked[0];
        const runnerUp = ranked[1];

        if (!best || best.dist > FACE_MATCH_THRESHOLD) {
          return { match: null, reason: 'unrecognized', bestDist: best ? best.dist : Infinity };
        }

        if (runnerUp && (runnerUp.dist - best.dist) < FACE_MARGIN_MIN) {
          return { match: null, reason: 'ambiguous', bestDist: best.dist };
        }

        const confidence = Math.max(75, Math.min(99, Math.round((1 - best.dist) * 130)));
        return { match: best.emp, confidence, bestDist: best.dist };
      };

      useEffect(() => {
        if (!cameraActive || activeTab !== 'kiosk' || enrollingEmp) {
          setLiveAiHint('');
          consecutiveMatchRef.current = { empId: null, count: 0 };
          if (faceLoopRef.current) {
            clearInterval(faceLoopRef.current);
            faceLoopRef.current = null;
          }
          if (scannerRef.current) {
            scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(() => {});
            scannerRef.current = null;
          }
          return;
        }

        const html5QrCode = new window.Html5Qrcode("qr-reader");
        scannerRef.current = html5QrCode;

        html5QrCode.start(
          { facingMode: "user" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (decodedText) => {
            if (authPolicyRef.current === 'FACE_ONLY') return;
            processScanWithBiometrics(decodedText, scanModeRef.current, true);
          },
          () => {}
        ).then(() => {
          faceLoopRef.current = setInterval(async () => {
            if (authPolicyRef.current !== 'FACE_ONLY' || isProcessingFaceRef.current) return;
            if (!modelsLoaded || !window.faceapi) {
              setLiveAiHint('Loading Face AI models...');
              return;
            }

            const enrolledList = employeesRef.current.filter(e => Array.isArray(e.faceDescriptor));
            if (enrolledList.length === 0) {
              setLiveAiHint('⚠ No faces registered yet — unlock Badges & Faces tab first');
              return;
            }

            const videoEl = document.querySelector('#qr-reader video');
            if (!videoEl || videoEl.readyState < 2) return;

            isProcessingFaceRef.current = true;
            try {
              const detection = await window.faceapi
                .detectSingleFace(videoEl, new window.faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.6 }))
                .withFaceLandmarks()
                .withFaceDescriptor();

              if (!detection) {
                consecutiveMatchRef.current = { empId: null, count: 0 };
                setLiveAiHint(`Scanning for ${enrolledList.length} registered face(s)... Look straight at camera`);
                isProcessingFaceRef.current = false;
                return;
              }

              const liveDesc = Array.from(detection.descriptor);
              const result = findStrictFaceMatch(liveDesc, enrolledList);

              if (result.match) {
                const bestMatch = result.match;

                if (consecutiveMatchRef.current.empId === bestMatch.id) {
                  consecutiveMatchRef.current.count += 1;
                } else {
                  consecutiveMatchRef.current = { empId: bestMatch.id, count: 1 };
                  setLiveAiHint(`Verifying ${bestMatch.name}... Hold still (1/2)`);
                  isProcessingFaceRef.current = false;
                  return;
                }

                if (consecutiveMatchRef.current.count < 2) {
                  isProcessingFaceRef.current = false;
                  return;
                }

                const now = Date.now();
                if (actionLockMapRef.current[bestMatch.id] && (now - actionLockMapRef.current[bestMatch.id]) < DEBOUNCE_MS) {
                  setLiveAiHint(`✓ Scanned ${bestMatch.name} (${result.confidence}% match)`);
                  isProcessingFaceRef.current = false;
                  return;
                }
                actionLockMapRef.current[bestMatch.id] = now;
                consecutiveMatchRef.current = { empId: null, count: 0 };

                const check = validateDuplicateAction(bestMatch, scanModeRef.current);
                if (!check.allowed) {
                  playBeepAndSpeak(false, check.spoken);
                  setScanStatus({ type: 'error', message: `⚠ ${check.message}` });
                  setLiveAiHint(`⚠ ${check.message}`);
                  isProcessingFaceRef.current = false;
                  return;
                }

                const finalAction = check.resolvedMode || scanModeRef.current;
                setLiveAiHint(`✓ Verified ${bestMatch.name} (${result.confidence}%) → ${finalAction.replace('_', ' ')}`);
                await recordVerifiedLog(bestMatch, finalAction, `Face Only (${result.confidence}%)`);
              } else if (result.reason === 'ambiguous') {
                consecutiveMatchRef.current = { empId: null, count: 0 };
                setLiveAiHint('⚠ Similar match detected — step closer & look straight at lens');
              } else {
                consecutiveMatchRef.current = { empId: null, count: 0 };
                setLiveAiHint('Face not recognized — step closer or ask Admin to re-register face');
              }
            } catch (e) {}
            isProcessingFaceRef.current = false;
          }, 750);
        }).catch(() => {
          setCameraActive(false);
          setScanStatus({ type: 'error', message: 'Camera permission denied. Allow camera in Chrome site settings.' });
        });

        return () => {
          if (faceLoopRef.current) {
            clearInterval(faceLoopRef.current);
            faceLoopRef.current = null;
          }
          if (scannerRef.current) {
            scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(() => {});
            scannerRef.current = null;
          }
        };
      }, [cameraActive, activeTab, enrollingEmp, modelsLoaded]);

      useEffect(() => {
        if (!enrollingEmp) {
          if (enrollStreamRef.current) {
            enrollStreamRef.current.getTracks().forEach(t => t.stop());
            enrollStreamRef.current = null;
          }
          return;
        }

        setEnrollMsg('Look straight at the camera in good lighting (remove mask/sunglasses) and tap Capture.');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
          .then(stream => {
            enrollStreamRef.current = stream;
            if (enrollVideoRef.current) {
              enrollVideoRef.current.srcObject = stream;
            }
          })
          .catch(() => {
            setEnrollMsg('Camera blocked. Please allow camera permission in Chrome settings.');
          });

        return () => {
          if (enrollStreamRef.current) {
            enrollStreamRef.current.getTracks().forEach(t => t.stop());
            enrollStreamRef.current = null;
          }
        };
      }, [enrollingEmp]);

      const captureAndSaveFace = async () => {
        unlockSpeechEngine();
        if (!modelsLoaded || !enrollVideoRef.current) {
          setEnrollMsg('Face AI models still loading, wait 2 seconds and try again.');
          return;
        }
        setCapturingFace(true);
        const samples = [];

        try {
          for (let attempt = 1; attempt <= 3; attempt++) {
            setEnrollMsg(`Capturing sample ${attempt} of 3 — hold steady...`);
            const detection = await window.faceapi
              .detectSingleFace(enrollVideoRef.current, new window.faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.6 }))
              .withFaceLandmarks()
              .withFaceDescriptor();

            if (!detection) {
              setCapturingFace(false);
              setEnrollMsg('Face lost during scan! Ensure bright front lighting and try again.');
              return;
            }
            samples.push(Array.from(detection.descriptor));
            if (attempt < 3) {
              await new Promise(r => setTimeout(r, 350));
            }
          }

          const averagedDescriptor = averageDescriptors(samples);
          setEmployees(prev =>
            prev.map(emp => (emp.id === enrollingEmp.id ? { ...emp, faceDescriptor: averagedDescriptor } : emp))
          );

          playBeepAndSpeak(true, `Face registered for ${enrollingEmp.name}`);
          setCapturingFace(false);
          setEnrollingEmp(null);
          setScanStatus({ type: 'success', message: `✓ 3-angle face biometric registered for ${enrollingEmp.name} (${enrollingEmp.id})!` });
        } catch (err) {
          setCapturingFace(false);
          setEnrollMsg('Error reading face. Please try again.');
        }
      };

      const recordVerifiedLog = async (employee, activeMode, biometricNote) => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const effectiveRules = getEffectiveRulesForEmployee(employee);
        const sched = evaluateScheduleStatus(employee, activeMode, now);
        const fullNote = sched.tag ? `${biometricNote} • ${sched.tag}` : biometricNote;

        const newLog = {
          id: 'LOG-' + Date.now(),
          rawTs: now.getTime(),
          date: getTodayKey(),
          empId: employee.id,
          name: employee.name,
          type: activeMode,
          time: timeStr,
          note: fullNote,
          shiftRules: effectiveRules,
          synced: false
        };

        attendanceLogsRef.current = [newLog, ...attendanceLogsRef.current];
        setAttendanceLogs(prev => [newLog, ...prev]);

        const modeLabels = {
          CHECK_IN: 'Checked In',
          LUNCH_OUT: 'Lunch Out',
          LUNCH_IN: 'Post Lunch In',
          CHECK_OUT: 'Checked Out',
          FIELD_DUTY: 'On Field Duty'
        };

        const spokenMessages = {
          CHECK_IN: `Welcome, ${employee.name}, Checked In${sched.spokenExtra}`,
          CHECK_OUT: `Thank you, ${employee.name}, Checked Out${sched.spokenExtra}`,
          LUNCH_OUT: `${employee.name}, Lunch Out${sched.spokenExtra}`,
          LUNCH_IN: `Welcome back, ${employee.name}, Post Lunch In${sched.spokenExtra}`,
          FIELD_DUTY: `${employee.name}, Field Duty logged`
        };

        playBeepAndSpeak(true, spokenMessages[activeMode]);

        const uploaded = await sendLogToGoogleSheet(newLog);
        if (uploaded) {
          setAttendanceLogs(prev =>
            prev.map(l => (l.id === newLog.id ? { ...l, synced: true } : l))
          );
        }

        const syncNote = uploaded
          ? '✓ Saved to Sheet'
          : isSheetConfigured
            ? '⏳ Queued Offline'
            : '⚠ Local Only';

        setScanStatus({
          type: 'success',
          message: `${employee.name} — ${modeLabels[activeMode]} [${fullNote}] (${syncNote})`
        });
      };

      const processScanWithBiometrics = async (scannedId, overrideMode = null, fromLiveCamera = false) => {
        unlockSpeechEngine();
        const activeMode = overrideMode || scanMode;
        const policy = authPolicyRef.current;
        const cleanId = scannedId.trim();
        const employee = employeesRef.current.find(e => e.id.toLowerCase() === cleanId.toLowerCase() || e.name.toLowerCase() === cleanId.toLowerCase());

        if (!employee) {
          playBeepAndSpeak(false, 'Unknown badge');
          setScanStatus({ type: 'error', message: `Unknown Badge ID: "${cleanId}". Access Denied.` });
          return;
        }

        const now = Date.now();
        if (actionLockMapRef.current[employee.id] && (now - actionLockMapRef.current[employee.id]) < DEBOUNCE_MS) {
          return;
        }
        actionLockMapRef.current[employee.id] = now;

        const check = validateDuplicateAction(employee, activeMode);
        if (!check.allowed) {
          playBeepAndSpeak(false, check.spoken);
          setScanStatus({ type: 'error', message: `⚠ ${check.message}` });
          return;
        }

        const finalAction = check.resolvedMode || activeMode;

        if (!fromLiveCamera) {
          const note = finalAction === 'FIELD_DUTY' ? 'Field Visit / Off-Site' : (activeMode === 'AUTO' ? 'Smart Auto Tap' : 'Manual Tap');
          await recordVerifiedLog(employee, finalAction, note);
          return;
        }

        if (policy === 'QR_ONLY') {
          await recordVerifiedLog(employee, finalAction, 'QR Only Verified');
          return;
        }

        let biometricNote = 'QR + Face Verified';
        if (employee.faceDescriptor && modelsLoaded) {
          setScanStatus({ type: 'info', message: `QR matched ${employee.name}. Verifying live face...` });
          const videoEl = document.querySelector('#qr-reader video');

          if (videoEl) {
            const detection = await window.faceapi
              .detectSingleFace(videoEl, new window.faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.6 }))
              .withFaceLandmarks()
              .withFaceDescriptor();

            if (!detection) {
              playBeepAndSpeak(false, 'Face not visible');
              setScanStatus({ type: 'error', message: `Face Not Visible: Hold QR badge slightly lower so your face is in frame.` });
              return;
            }

            const distance = euclideanDistance(Array.from(detection.descriptor), employee.faceDescriptor);
            if (distance > FACE_MATCH_THRESHOLD) {
              playBeepAndSpeak(false, 'Face mismatch');
              setScanStatus({ type: 'error', message: `Biometric Mismatch! Face does not match ${employee.name} (${employee.id}).` });
              return;
            }
          }
        } else {
          biometricNote = 'QR Only (Face Not Enrolled)';
        }

        await recordVerifiedLog(employee, finalAction, biometricNote);
      };

      const handleAddEmployee = (e) => {
        e.preventDefault();
        if (!newEmpName.trim()) return;

        const finalId = newEmpId.trim() ? newEmpId.trim().toUpperCase() : getNextAutoEmpId();
        const duplicate = employees.find(emp => emp.id.toLowerCase() === finalId.toLowerCase());
        if (duplicate) {
          window.alert(`Employee ID "${finalId}" already belongs to ${duplicate.name}. Please enter a unique ID.`);
          return;
        }

        setEmployees([...employees, {
          id: finalId,
          name: newEmpName.trim(),
          department: newEmpDept,
          role: newEmpRole.trim() || 'Staff Member',
          faceDescriptor: null,
          customShift: newEmpCustomShift
            ? { checkInTime: newEmpIn, checkOutTime: newEmpOut, maxLunchMinutes: Number(newEmpLunch) || 30 }
            : null
        }]);

        setNewEmpId('');
        setNewEmpName('');
        setNewEmpRole('');
        setNewEmpCustomShift(false);
        setShowAddModal(false);
      };

      const openEditEmpModal = (emp) => {
        setEditingEmp(emp);
        setEditEmpForm({
          id: emp.id,
          name: emp.name,
          department: emp.department || 'Development',
          role: emp.role || ''
        });
      };

      const saveEditedEmp = (e) => {
        e.preventDefault();
        if (!editingEmp || !editEmpForm.name.trim() || !editEmpForm.id.trim()) return;

        const finalId = editEmpForm.id.trim().toUpperCase();
        const duplicate = employees.find(
          emp => emp.id.toLowerCase() === finalId.toLowerCase() && emp.id !== editingEmp.id
        );
        if (duplicate) {
          window.alert(`Employee ID "${finalId}" already belongs to ${duplicate.name}. Please enter a unique ID.`);
          return;
        }

        setEmployees(prev =>
          prev.map(emp =>
            emp.id === editingEmp.id
              ? {
                  ...emp,
                  id: finalId,
                  name: editEmpForm.name.trim(),
                  department: editEmpForm.department,
                  role: editEmpForm.role.trim() || 'Staff Member'
                }
              : emp
          )
        );
        setEditingEmp(null);
      };

      const openEmpShiftEditor = (emp) => {
        setEditingShiftEmp(emp);
        if (emp.customShift) {
          setEmpShiftForm({
            useCustom: true,
            checkInTime: emp.customShift.checkInTime || shiftRules.checkInTime,
            checkOutTime: emp.customShift.checkOutTime || shiftRules.checkOutTime,
            maxLunchMinutes: emp.customShift.maxLunchMinutes || shiftRules.maxLunchMinutes
          });
        } else {
          setEmpShiftForm({
            useCustom: false,
            checkInTime: shiftRules.checkInTime,
            checkOutTime: shiftRules.checkOutTime,
            maxLunchMinutes: shiftRules.maxLunchMinutes
          });
        }
      };

      const saveEmpShift = (e) => {
        e.preventDefault();
        if (!editingShiftEmp) return;
        setEmployees(prev =>
          prev.map(emp =>
            emp.id === editingShiftEmp.id
              ? {
                  ...emp,
                  customShift: empShiftForm.useCustom
                    ? {
                        checkInTime: empShiftForm.checkInTime,
                        checkOutTime: empShiftForm.checkOutTime,
                        maxLunchMinutes: Number(empShiftForm.maxLunchMinutes) || 30
                      }
                    : null
                }
              : emp
          )
        );
        setEditingShiftEmp(null);
      };

      const handleRemoveEmployee = (emp) => {
        if (!window.confirm(`Remove ${emp.name} (${emp.id}) from the kiosk? Past logs in Google Sheets will remain intact.`)) {
          return;
        }
        setEmployees(prev => prev.filter(item => item.id !== emp.id));
        if (selectedBadge && selectedBadge.id === emp.id) {
          setSelectedBadge(null);
        }
      };

      const pendingSyncCount = attendanceLogs.filter(l => !l.synced).length;

      const s = {
        header: { backgroundColor: '#0f172a', borderBottom: '1px solid #1e293b', padding: '16px 24px', display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '16px' },
        brandWrap: { display: 'flex', alignItems: 'center', gap: '12px' },
        logoBox: { backgroundColor: '#4f46e5', padding: '10px', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center' },
        title: { fontSize: '18px', fontWeight: 700, margin: 0, color: '#ffffff' },
        subtitle: { fontSize: '12px', color: '#94a3b8', margin: '2px 0 0 0' },
        badgeOnline: { fontSize: '12px', fontWeight: 600, padding: '4px 12px', borderRadius: '999px', backgroundColor: isOnline && isSheetConfigured ? 'rgba(16,185,129,0.15)' : 'rgba(245,158,11,0.15)', color: isOnline && isSheetConfigured ? '#34d399' : '#fbbf24', border: `1px solid ${isOnline && isSheetConfigured ? 'rgba(16,185,129,0.3)' : 'rgba(245,158,11,0.3)'}` },
        nav: { display: 'flex', backgroundColor: '#020617', padding: '6px', borderRadius: '12px', border: '1px solid #1e293b', gap: '4px' },
        navBtn: (active) => ({ padding: '8px 14px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontSize: '13px', fontWeight: 600, backgroundColor: active ? '#4f46e5' : 'transparent', color: active ? '#ffffff' : '#94a3b8' }),
        main: { maxWidth: '1200px', margin: '0 auto', padding: '24px' },
        grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '20px' },
        card: { backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '16px', padding: '20px', marginBottom: '20px' },
        modeGrid: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px', marginTop: '12px' },
        modeBtn: (active, color) => ({ padding: '14px', borderRadius: '12px', border: `1px solid ${active ? color : '#1e293b'}`, backgroundColor: active ? `${color}22` : '#020617', color: active ? color : '#94a3b8', fontWeight: 700, fontSize: '14px', cursor: 'pointer', textAlign: 'left' }),
        policyGrid: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px', marginTop: '10px' },
        policyBtn: (active) => ({ padding: '10px 8px', borderRadius: '10px', border: `1px solid ${active ? '#6366f1' : '#1e293b'}`, backgroundColor: active ? 'rgba(99,102,241,0.2)' : '#020617', color: active ? '#a5b4fc' : '#94a3b8', fontWeight: 700, fontSize: '12px', cursor: 'pointer', textAlign: 'center' }),
        scannerBox: { width: '260px', minHeight: '240px', margin: '20px auto', border: '2px dashed #6366f1', borderRadius: '24px', backgroundColor: '#020617', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '12px', overflow: 'hidden' },
        alert: (type) => ({ padding: '14px 16px', borderRadius: '12px', fontSize: '14px', fontWeight: 600, marginTop: '16px', backgroundColor: type === 'success' ? 'rgba(16,185,129,0.15)' : type === 'error' ? 'rgba(244,63,94,0.15)' : 'rgba(59,130,246,0.15)', color: type === 'success' ? '#6ee7b7' : type === 'error' ? '#fda4af' : '#93c5fd', border: `1px solid ${type === 'success' ? '#10b981' : type === 'error' ? '#f43f5e' : '#3b82f6'}` }),
        testBtn: { backgroundColor: '#1e293b', color: '#e2e8f0', border: '1px solid #334155', padding: '8px 12px', borderRadius: '8px', fontSize: '12px', fontWeight: 600, cursor: 'pointer' },
        dangerBtn: { backgroundColor: 'rgba(244,63,94,0.15)', color: '#fda4af', border: '1px solid rgba(244,63,94,0.35)', padding: '8px 12px', borderRadius: '8px', fontSize: '12px', fontWeight: 600, cursor: 'pointer' },
        logItem: { backgroundColor: '#020617', border: '1px solid #1e293b', padding: '12px 14px', borderRadius: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' },
        primaryBtn: { backgroundColor: '#4f46e5', color: '#ffffff', border: 'none', padding: '10px 16px', borderRadius: '10px', fontSize: '13px', fontWeight: 600, cursor: 'pointer' },
        input: { width: '100%', backgroundColor: '#020617', border: '1px solid #1e293b', borderRadius: '10px', padding: '10px 12px', color: '#ffffff', fontSize: '14px', marginTop: '6px', marginBottom: '14px' },
        modalOverlay: { position: 'fixed', inset: 0, backgroundColor: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px', zIndex: 50, overflowY: 'auto' }
      };

      const policyHint = {
        FACE_ONLY: scanMode === 'AUTO'
          ? 'Smart Auto: 1st Scan = In • After 1PM = Lunch Out • Rescan = Post Lunch • After 7h = Check-Out'
          : 'Look directly at the front camera — 2-frame strict verification active',
        QR_ONLY: 'Hold QR badge up to camera for instant badge check-in',
        BOTH: 'Hold QR badge below chin so both face & QR are visible'
      };

      return (
        <div>
          <header style={s.header}>
            <div style={s.brandWrap}>
              <div style={s.logoBox}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2">
                  <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" />
                  <circle cx="12" cy="10" r="3" />
                  <path d="M7 18c1.5-2 8.5-2 10 0" />
                </svg>
              </div>
              <div>
                <h1 style={s.title}>Altics Biometric Kiosk</h1>
                <p style={s.subtitle}>
                  Shift: {shiftRules.checkInTime} (+{shiftRules.graceMinutes}m) – {shiftRules.checkOutTime} • Lunch: {shiftRules.maxLunchMinutes}m (+{shiftRules.lunchGraceMinutes}m)
                </p>
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
              {isAdminUnlocked && (
                <button style={s.dangerBtn} onClick={lockAdminNow}>
                  🔓 Lock Admin
                </button>
              )}
              <button
                style={{ ...s.testBtn, backgroundColor: voiceEnabled ? 'rgba(99,102,241,0.2)' : '#1e293b', color: voiceEnabled ? '#a5b4fc' : '#94a3b8' }}
                onClick={() => { unlockSpeechEngine(); setVoiceEnabled(!voiceEnabled); }}
              >
                {voiceEnabled ? '🔊 Voice Name On' : '🔇 Beep Only'}
              </button>
              <div style={s.badgeOnline}>
                {!isSheetConfigured
                  ? '⚠ Sheet URL Not Set'
                  : isOnline
                    ? (isSyncing ? 'Syncing...' : pendingSyncCount > 0 ? `${pendingSyncCount} Pending` : '● Google Sheet Synced')
                    : `● Offline (${pendingSyncCount} queued)`}
              </div>
              {pendingSyncCount > 0 && isOnline && isSheetConfigured && (
                <button style={s.testBtn} onClick={() => syncPendingLogs(attendanceLogs)}>Sync Now</button>
              )}
            </div>

            <nav style={s.nav}>
              <button style={s.navBtn(activeTab === 'kiosk')} onClick={() => handleTabSwitch('kiosk')}>Kiosk Terminal</button>
              <button style={s.navBtn(activeTab === 'employees')} onClick={() => handleTabSwitch('employees')}>
                {isAdminUnlocked ? '' : '🔒 '}Badges & Faces ({employees.length})
              </button>
              <button style={s.navBtn(activeTab === 'reports')} onClick={() => handleTabSwitch('reports')}>
                {isAdminUnlocked ? '' : '🔒 '}Shift Rules & Logs
              </button>
            </nav>
          </header>

          <main style={s.main}>
            {activeTab === 'kiosk' && (
              <div style={s.grid}>
                <div>
                  <div style={s.card}>
                    <div style={{ fontSize: '12px', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase' }}>1. Select Attendance Action</div>
                    <div style={s.modeGrid}>
                      <button
                        style={{ ...s.modeBtn(scanMode === 'AUTO', '#38bdf8'), gridColumn: 'span 2', textAlign: 'center' }}
                        onClick={() => { unlockSpeechEngine(); setScanMode('AUTO'); }}
                      >
                        ⚡ Smart Auto (In → 1PM Lunch → Return → 7h Out)
                      </button>
                      <button style={s.modeBtn(scanMode === 'CHECK_IN', '#10b981')} onClick={() => { unlockSpeechEngine(); setScanMode('CHECK_IN'); }}>✓ Check-In</button>
                      <button style={s.modeBtn(scanMode === 'CHECK_OUT', '#f43f5e')} onClick={() => { unlockSpeechEngine(); setScanMode('CHECK_OUT'); }}>↪ Check-Out</button>
                      <button style={s.modeBtn(scanMode === 'LUNCH_OUT', '#f59e0b')} onClick={() => { unlockSpeechEngine(); setScanMode('LUNCH_OUT'); }}>☕ Lunch Out</button>
                      <button style={s.modeBtn(scanMode === 'LUNCH_IN', '#3b82f6')} onClick={() => { unlockSpeechEngine(); setScanMode('LUNCH_IN'); }}>⏱ Post Lunch In</button>
                      <button style={{ ...s.modeBtn(scanMode === 'FIELD_DUTY', '#a855f7'), gridColumn: 'span 2' }} onClick={() => { unlockSpeechEngine(); setScanMode('FIELD_DUTY'); }}>🚗 Field Duty / Off-Site Visit</button>
                    </div>

                    <div style={{ fontSize: '12px', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', marginTop: '18px' }}>2. Verification Requirement</div>
                    <div style={s.policyGrid}>
                      <button style={s.policyBtn(authPolicy === 'FACE_ONLY')} onClick={() => setAuthPolicy('FACE_ONLY')}>Face Only</button>
                      <button style={s.policyBtn(authPolicy === 'QR_ONLY')} onClick={() => setAuthPolicy('QR_ONLY')}>QR Only</button>
                      <button style={s.policyBtn(authPolicy === 'BOTH')} onClick={() => setAuthPolicy('BOTH')}>QR + Face</button>
                    </div>
                  </div>

                  <div style={s.card}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span style={{ fontSize: '12px', color: '#34d399', fontWeight: 600 }}>
                        ● {scanMode === 'AUTO' ? 'Smart Auto Active' : `Manual: ${scanMode.replace('_', ' ')}`} ({authPolicy === 'FACE_ONLY' ? 'Face' : authPolicy === 'QR_ONLY' ? 'QR' : 'QR+Face'})
                      </span>
                      <button
                        style={{ ...s.primaryBtn, backgroundColor: cameraActive ? '#f43f5e' : '#10b981', padding: '6px 12px', fontSize: '12px' }}
                        onClick={() => { unlockSpeechEngine(); setCameraActive(!cameraActive); }}
                      >
                        {cameraActive ? 'Stop Camera' : '📷 Start Camera'}
                      </button>
                    </div>

                    <div style={s.scannerBox}>
                      {cameraActive ? (
                        <div id="qr-reader"></div>
                      ) : (
                        <>
                          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#818cf8" strokeWidth="2" style={{ marginBottom: '10px' }}>
                            <circle cx="12" cy="10" r="3" />
                            <path d="M7 18c1.5-2 8.5-2 10 0" />
                            <rect x="3" y="3" width="18" height="18" rx="4" />
                          </svg>
                          <div style={{ fontSize: '14px', fontWeight: 600 }}>Tap "Start Camera" Above</div>
                          <div style={{ fontSize: '12px', color: '#64748b', marginTop: '4px' }}>{policyHint[authPolicy]}</div>
                        </>
                      )}
                    </div>

                    {cameraActive && (
                      <div style={{ textAlign: 'center', fontSize: '12px', color: '#a5b4fc', fontWeight: 600 }}>
                        {liveAiHint || policyHint[authPolicy]}
                      </div>
                    )}

                    {scanStatus && <div style={s.alert(scanStatus.type)}>{scanStatus.message}</div>}

                    <div style={{ marginTop: '20px', borderTop: '1px solid #1e293b', paddingTop: '16px' }}>
                      <div style={{ fontSize: '11px', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', marginBottom: '10px' }}>
                        Manual Quick-Tap Backup (Only if Camera Off):
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                        {employees.map(emp => (
                          <button key={emp.id} style={s.testBtn} onClick={() => processScanWithBiometrics(emp.id, null, false)}>
                            {emp.name}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <div style={s.card}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                    <span style={{ fontSize: '13px', fontWeight: 700, textTransform: 'uppercase', color: '#cbd5e1' }}>Live Activity Stream</span>
                    <span style={{ fontSize: '12px', color: '#818cf8', fontWeight: 600 }}>{attendanceLogs.length} Total</span>
                  </div>
                  {attendanceLogs.length === 0 && (
                    <div style={{ fontSize: '13px', color: '#64748b', textAlign: 'center', padding: '24px 0' }}>No scans recorded yet today.</div>
                  )}
                  {attendanceLogs.map(log => (
                    <div key={log.id} style={s.logItem}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: '14px' }}>{log.name}</div>
                        <div style={{ fontSize: '12px', color: '#94a3b8', marginTop: '4px' }}>
                          <span style={{ backgroundColor: '#1e293b', padding: '2px 6px', borderRadius: '4px', marginRight: '8px' }}>{log.type.replace('_', ' ')}</span>
                          {log.time} • <span style={{ color: '#818cf8' }}>{log.note}</span>
                        </div>
                      </div>
                      <span style={{ fontSize: '11px', fontWeight: 600, color: log.synced ? '#34d399' : '#fbbf24' }}>
                        {log.synced ? '✓ In Sheet' : 'Offline Queue'}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'employees' && isAdminUnlocked && (
              <div>
                <div style={{ ...s.card, display: 'flex', flexWrap: 'wrap', gap: '12px', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <h2 style={{ margin: 0, fontSize: '18px' }}>Staff QR Badges, Face & Shift Timings</h2>
                    <p style={{ margin: '4px 0 0 0', fontSize: '12px', color: '#94a3b8' }}>Admin Mode Active. Switching back to Kiosk Terminal will automatically re-lock this tab.</p>
                  </div>
                  <button style={s.primaryBtn} onClick={() => setShowAddModal(true)}>+ Enroll New Staff</button>
                </div>

                <div style={s.grid}>
                  {employees.map(emp => (
                    <div key={emp.id} style={s.card}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '12px' }}>
                        <div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' }}>
                            <span style={{ fontSize: '11px', fontFamily: 'monospace', color: '#818cf8', backgroundColor: 'rgba(99,102,241,0.15)', padding: '2px 8px', borderRadius: '6px' }}>{emp.id}</span>
                            <span style={{ fontSize: '11px', fontWeight: 600, color: emp.faceDescriptor ? '#34d399' : '#fbbf24' }}>
                              {emp.faceDescriptor ? '✓ Face Registered' : '⚠ No Face Yet'}
                            </span>
                          </div>
                          <h3 style={{ margin: '8px 0 4px 0', fontSize: '16px' }}>{emp.name}</h3>
                          <p style={{ margin: '0 0 6px 0', fontSize: '12px', color: '#94a3b8' }}>{emp.role} • {emp.department}</p>
                          <div style={{ fontSize: '11px', color: emp.customShift ? '#a5b4fc' : '#64748b', fontWeight: 600 }}>
                            {emp.customShift
                              ? `⏰ Custom Shift: ${emp.customShift.checkInTime} – ${emp.customShift.checkOutTime} (Lunch ${emp.customShift.maxLunchMinutes}m + ${shiftRules.lunchGraceMinutes}m)`
                              : `⏰ Default Shift: ${shiftRules.checkInTime} – ${shiftRules.checkOutTime} (Lunch ${shiftRules.maxLunchMinutes}m + ${shiftRules.lunchGraceMinutes}m)`}
                          </div>
                        </div>
                        <div style={{ backgroundColor: '#ffffff', padding: '6px', borderRadius: '8px', flexShrink: 0 }}>
                          <EmployeeQRCode value={emp.id} size={56} />
                        </div>
                      </div>
                      <div style={{ marginTop: '16px', paddingTop: '12px', borderTop: '1px solid #1e293b', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '8px' }}>
                        <button
                          style={{ ...s.testBtn, backgroundColor: emp.faceDescriptor ? '#1e293b' : '#065f46', color: '#fff' }}
                          onClick={() => setEnrollingEmp(emp)}
                        >
                          {emp.faceDescriptor ? '🔄 Re-Capture Face' : '📸 Register Face'}
                        </button>
                        <button style={s.testBtn} onClick={() => openEditEmpModal(emp)}>
                          ✏️ Edit
                        </button>
                        <button style={s.testBtn} onClick={() => openEmpShiftEditor(emp)}>
                          ⏰ Shift
                        </button>
                        <button style={s.primaryBtn} onClick={() => setSelectedBadge(emp)}>Badge</button>
                        <button style={s.dangerBtn} onClick={() => handleRemoveEmployee(emp)}>🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'reports' && isAdminUnlocked && (
              <div>
                <div style={s.card}>
                  <h2 style={{ margin: '0 0 6px 0', fontSize: '18px' }}>Default Office Shift & Lunch Timings</h2>
                  <p style={{ margin: '0 0 16px 0', fontSize: '12px', color: '#94a3b8' }}>Applies to all staff unless an individual custom shift is set in the Badges & Faces tab.</p>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: '12px' }}>
                    <div>
                      <label style={{ fontSize: '12px', color: '#94a3b8' }}>Default Check-In</label>
                      <input
                        style={s.input}
                        type="time"
                        value={shiftRules.checkInTime}
                        onChange={e => setShiftRules({ ...shiftRules, checkInTime: e.target.value })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', color: '#94a3b8' }}>Check-In Grace (mins)</label>
                      <input
                        style={s.input}
                        type="number"
                        min="0"
                        max="60"
                        value={shiftRules.graceMinutes}
                        onChange={e => setShiftRules({ ...shiftRules, graceMinutes: Number(e.target.value) })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', color: '#94a3b8' }}>Default Check-Out</label>
                      <input
                        style={s.input}
                        type="time"
                        value={shiftRules.checkOutTime}
                        onChange={e => setShiftRules({ ...shiftRules, checkOutTime: e.target.value })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', color: '#94a3b8' }}>Lunch Window Start</label>
                      <input
                        style={s.input}
                        type="time"
                        value={shiftRules.lunchStart}
                        onChange={e => setShiftRules({ ...shiftRules, lunchStart: e.target.value })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', color: '#94a3b8' }}>Lunch Window End</label>
                      <input
                        style={s.input}
                        type="time"
                        value={shiftRules.lunchEnd}
                        onChange={e => setShiftRules({ ...shiftRules, lunchEnd: e.target.value })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', color: '#94a3b8' }}>Default Max Lunch (mins)</label>
                      <input
                        style={s.input}
                        type="number"
                        min="10"
                        max="120"
                        value={shiftRules.maxLunchMinutes}
                        onChange={e => setShiftRules({ ...shiftRules, maxLunchMinutes: Number(e.target.value) })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '12px', color: '#94a3b8' }}>Lunch Grace (mins)</label>
                      <input
                        style={s.input}
                        type="number"
                        min="0"
                        max="30"
                        value={shiftRules.lunchGraceMinutes}
                        onChange={e => setShiftRules({ ...shiftRules, lunchGraceMinutes: Number(e.target.value) })}
                      />
                    </div>
                  </div>
                </div>

                <div style={s.card}>
                  <h2 style={{ margin: '0 0 6px 0', fontSize: '18px' }}>Altics Master Attendance Log</h2>
                  <p style={{ margin: '0 0 16px 0', fontSize: '12px', color: '#94a3b8' }}>All scans synced automatically to your Google Sheet.</p>
                  <div style={{ overflowX: 'auto' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '13px' }}>
                      <thead>
                        <tr style={{ borderBottom: '1px solid #1e293b', color: '#94a3b8' }}>
                          <th style={{ padding: '12px' }}>Employee</th>
                          <th style={{ padding: '12px' }}>Action</th>
                          <th style={{ padding: '12px' }}>Status & Verification</th>
                          <th style={{ padding: '12px' }}>Time</th>
                          <th style={{ padding: '12px' }}>Google Sheet</th>
                        </tr>
                      </thead>
                      <tbody>
                        {attendanceLogs.map(log => (
                          <tr key={log.id} style={{ borderBottom: '1px solid #1e293b' }}>
                            <td style={{ padding: '12px', fontWeight: 600 }}>{log.name} ({log.empId})</td>
                            <td style={{ padding: '12px' }}>{log.type.replace('_', ' ')}</td>
                            <td style={{ padding: '12px', color: '#818cf8' }}>{log.note}</td>
                            <td style={{ padding: '12px' }}>{log.time}</td>
                            <td style={{ padding: '12px', color: log.synced ? '#34d399' : '#fbbf24' }}>{log.synced ? '✓ Synced' : 'Queued'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {pendingAdminTab && (
            <div style={s.modalOverlay}>
              <div style={{ ...s.card, width: '100%', maxWidth: '340px', textAlign: 'center' }}>
                <h3 style={{ marginTop: 0 }}>🔒 Admin PIN Required</h3>
                <p style={{ fontSize: '12px', color: '#94a3b8', marginBottom: '14px' }}>
                  Enter the Admin PIN to add, edit, or remove staff and shift rules.
                </p>
                <form onSubmit={handlePinSubmit}>
                  <input
                    style={{ ...s.input, textAlign: 'center', fontSize: '20px', letterSpacing: '6px' }}
                    type="password"
                    inputMode="numeric"
                    autoFocus
                    required
                    value={pinInput}
                    onChange={e => setPinInput(e.target.value)}
                    placeholder="••••"
                  />
                  {pinError && (
                    <div style={{ color: '#fda4af', fontSize: '12px', fontWeight: 600, marginBottom: '12px' }}>
                      {pinError}
                    </div>
                  )}
                  <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                    <button
                      type="button"
                      style={s.testBtn}
                      onClick={() => { setPendingAdminTab(null); setPinInput(''); setPinError(''); }}
                    >
                      Cancel
                    </button>
                    <button type="submit" style={s.primaryBtn}>Unlock</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editingEmp && (
            <div style={s.modalOverlay}>
              <div style={{ ...s.card, width: '100%', maxWidth: '400px' }}>
                <h3 style={{ marginTop: 0 }}>Edit Staff Details</h3>
                <form onSubmit={saveEditedEmp}>
                  <label style={{ fontSize: '12px', color: '#94a3b8' }}>Employee ID</label>
                  <input
                    style={s.input}
                    type="text"
                    required
                    value={editEmpForm.id}
                    onChange={e => setEditEmpForm({ ...editEmpForm, id: e.target.value })}
                  />
                  <label style={{ fontSize: '12px', color: '#94a3b8' }}>Full Name</label>
                  <input
                    style={s.input}
                    type="text"
                    required
                    value={editEmpForm.name}
                    onChange={e => setEditEmpForm({ ...editEmpForm, name: e.target.value })}
                  />
                  <label style={{ fontSize: '12px', color: '#94a3b8' }}>Department</label>
                  <select
                    style={s.input}
                    value={editEmpForm.department}
                    onChange={e => setEditEmpForm({ ...editEmpForm, department: e.target.value })}
                  >
                    <option value="Development">Development</option>
                    <option value="Design">Design</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Operations">Operations</option>
                  </select>
                  <label style={{ fontSize: '12px', color: '#94a3b8' }}>Role</label>
                  <input
                    style={s.input}
                    type="text"
                    value={editEmpForm.role}
                    onChange={e => setEditEmpForm({ ...editEmpForm, role: e.target.value })}
                  />
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '10px' }}>
                    <button type="button" style={s.testBtn} onClick={() => setEditingEmp(null)}>Cancel</button>
                    <button type="submit"
